name: Test
# Unit tests on every PR and on main — until now CI only built images and tests ran only locally.
# `test` runs each app's own tests/; `root-tests` runs the repo-root tests/ (cross-app, some DB-bound)
# against a throwaway Postgres migrated to alembic head.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Tests mock AWS/KMS; dummy credentials make sure an unmocked call fails instead of reaching AWS.
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-2

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [api, shared, worker]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          version: 1.8.4
          virtualenvs-in-project: true
      - uses: actions/cache@v4
        with:
          path: apps/${{ matrix.app }}/.venv
          key: ${{ matrix.app }}-venv-${{ runner.os }}-${{ hashFiles(format('apps/{0}/poetry.lock', matrix.app), 'apps/shared/**/*.py', 'apps/shared/pyproject.toml') }}
      - run: poetry install --no-interaction
      # `python -m pytest` so the app directory is on sys.path (see apps/api/tests/conftest.py)
      - name: pytest
        run: poetry run python -m pytest tests -q

  root-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iap_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # tests/conftest.py migrates this DB to head; each test runs in a rolled-back transaction
      TEST_DB_URI: postgresql://postgres:postgres@localhost:5432/iap_test
      # root tests import both `app.*` (api) and `shared.*`; the repo root makes `apps.*` importable
      PYTHONPATH: apps/api:apps/shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          version: 1.8.4
          virtualenvs-in-project: true
      - uses: actions/cache@v4
        with:
          path: apps/api/.venv
          key: api-venv-${{ runner.os }}-${{ hashFiles('apps/api/poetry.lock', 'apps/shared/**/*.py', 'apps/shared/pyproject.toml') }}
      # the api env covers the root tests' imports (api, shared, worker config, alembic)
      - run: poetry install --no-interaction
        working-directory: apps/api
      - name: pytest
        run: apps/api/.venv/bin/python -m pytest tests -q
