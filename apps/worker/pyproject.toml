[tool.poetry]
name = "worker"
version = "1.0.0"
description = "Worker service of Nine Chronicles"
authors = ["Planetarium <engineering@planetariumhq.com>"]
readme = "README.md"
include = ["app/*"]
exclude = [".env.sample", "tests/*"]
package-mode = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "^3.11"
structlog = "^25.2.0"
pydantic-settings = "^2.8.1"
shared = { path = "../shared" }
celery = { extras = ["redis"], version = "^5.4" }
flower = "^2.0.1"
requests = "^2.31.0"
# (PLD-1470) track_web_refund 의 Stripe 환불 폴링용. shared 가 이미 같은 버전을 쓰지만
#   워커가 직접 임포트하므로 전이 의존에 기대지 않고 명시한다(shared 의 의존이 바뀌면 조용히 깨진다).
#   lock 은 apps/shared·apps/api 와 같은 13.0.1 로 맞췄다 — Dockerfile.Worker 가 shared 레이어를 먼저
#   설치하므로 버전이 어긋나면 두 번째 레이어에서 stripe 를 재설치한다(이미지 스큐).
stripe = "^13.0.1"

[tool.poetry.group.test.dependencies]
pytest = "^7.0,<7.2"
pytest-mock = "^3.6.0,<3.10"
pytest-cov = "^2.10.0,<3.0.0"

[tool.poetry.group.type.dependencies]
mypy = "^0.971"
types-requests = "^2.29.1"
types-PyYAML = "^6.0.12"

[tool.poetry.group.dev.dependencies]
pre-commit = "^2.17.0,<3.0.0"
black = "^22.6.0"
isort = "^5.0.6,<6.0.0"
colorama = "^0.4.6"

[tool.poetry.group.tool.dependencies]
alembic = "^1.12.0"
